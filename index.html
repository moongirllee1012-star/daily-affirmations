<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f1e8">
  <link rel="manifest" href="./manifest.webmanifest">
<title>每日感恩・肯定語</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f1e8;
  color:#40382f;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}

main{
  max-width:600px;
  margin:auto;
  padding:25px 16px 50px;
}

.hero{
  text-align:center;
  padding:15px 0 20px;
}

.hero .icon{font-size:45px}

h1{
  font-size:28px;
  margin:8px 0;
}

.subtitle{
  color:#8b8176;
}

.card{
  background:#fffdf9;
  border:1px solid #e8ded1;
  border-radius:22px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 5px 20px #00000008;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.count{
  text-align:center;
  background:#f1e7da;
  border-radius:18px;
  padding:15px;
}

.num{
  font-size:38px;
  font-weight:bold;
}

button,input{
  font:inherit;
}

button{
  border:0;
  border-radius:14px;
  padding:13px 16px;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#40382f;
  color:white;
  margin-top:10px;
}

.affirm{
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  line-height:1.6;
}

.form{
  display:flex;
  gap:8px;
}

.form input{
  flex:1;
  border:1px solid #e8ded1;
  border-radius:14px;
  padding:12px;
}

.chip{
  background:#f1e7da;
  margin:5px 3px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  background:white;
  border:1px solid #e8ded1;
  border-radius:9px;
  min-height:48px;
  padding:5px;
  font-size:12px;
}

.has{
  background:#eadcc9;
}

.today{
  outline:2px solid #9a7650;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:#fffaf2;
  border-radius:26px;
  padding:30px;
  text-align:center;
  max-width:400px;
}

.modal-box .big{
  font-size:60px;
}
</style>
</head>

<body>

<main>

<section class="hero">
  <div class="icon">🌿</div>
  <h1>每日感恩・肯定語</h1>
  <div class="subtitle">每天一點點，讓心回到自己身上。</div>
</section>

<section class="card">

<div class="grid">

<div class="count">
<div class="num" id="thanks">0</div>
謝謝
</div>

<div class="count">
<div class="num" id="lucky">0</div>
我很幸運
</div>

</div>

<button class="primary" onclick="addThanks()">
🙏 謝謝 +1
</button>

<button class="primary" onclick="addLucky()">
🍀 我很幸運 +1
</button>

</section>


<section class="card">

<h3>✨ 今日肯定語</h3>

<div class="affirm" id="affirmation"></div>

<button onclick="nextAffirmation()">
換一句
</button>

</section>


<section class="card">

<h3>✏️ 自訂肯定句</h3>

<div class="form">

<input
id="customInput"
placeholder="輸入你的肯定句">

<button onclick="addCustom()">
加入
</button>

</div>

<div id="customList"></div>

</section>


<section class="card">

<h3>🪷 準提咒</h3>

<div class="grid">

<div class="count">
<div class="num" id="mantra">0</div>
今日遍數
</div>

<button onclick="addMantra()">
準提咒 +1
</button>

</div>

</section>


<section class="card">

<h3>📅 每日紀錄</h3>

<p id="month"></p>

<div class="calendar" id="calendar"></div>

</section>

</main>


<div class="modal" id="milestoneModal">

<div class="modal-box">

<div class="big">🙏</div>

<h2>謝謝自己</h2>

<p>
你已經累積
<b id="milestoneNumber">1000</b>
次「謝謝」。
</p>

<p>
願每一次感恩，<br>
都成為生活裡的光。
</p>

<button class="primary"
onclick="closeMilestone()">
繼續感恩
</button>

</div>

</div>


<script>

const STORAGE_KEY="daily_affirmations";

let data=JSON.parse(
localStorage.getItem(STORAGE_KEY)
)||{
  thanks:0,
  lucky:0,
  mantra:{},
  records:{},
  custom:[]
};


const defaultAffirmations=[
"我值得被好好對待。",
"今天的我，已經很棒了。",
"我願意相信事情會越來越好。",
"我有能力創造自己喜歡的生活。",
"我很幸運，也願意看見生活裡的美好。",
"我感謝今天遇見的一切。",
"我值得擁有幸福與豐盛。",
"我正在一步一步成為更好的自己。"
];


let affirmationIndex=0;


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

render();

}


function ensureToday(){

const d=today();

if(!data.records[d]){

data.records[d]={
thanks:0,
lucky:0,
mantra:0
};

}

}


function addThanks(){

data.thanks++;

ensureToday();

data.records[today()].thanks++;

save();

if(data.thanks%1000===0){

document.getElementById(
"milestoneNumber"
).textContent=data.thanks;

document.getElementById(
"milestoneModal"
).style.display="flex";

}

}


function addLucky(){

data.lucky++;

ensureToday();

data.records[today()].lucky++;

save();

}


function addMantra(){

const d=today();

if(!data.mantra[d])
data.mantra[d]=0;

data.mantra[d]++;

ensureToday();

data.records[d].mantra=data.mantra[d];

save();

}


function addCustom(){

const input=
document.getElementById("customInput");

const text=input.value.trim();

if(!text)return;

data.custom.push(text);

input.value="";

save();

}


function nextAffirmation(){

const all=
defaultAffirmations.concat(data.custom);

affirmationIndex++;

document.getElementById(
"affirmation"
).textContent=
all[
affirmationIndex%all.length
];

}


function renderCustom(){

const box=
document.getElementById("customList");

box.innerHTML="";

data.custom.forEach(function(text){

const button=
document.createElement("button");

button.className="chip";

button.textContent=text;

button.onclick=function(){

document.getElementById(
"affirmation"
).textContent=text;

};

box.appendChild(button);

});

}


function renderCalendar(){

const calendar=
document.getElementById("calendar");

calendar.innerHTML="";

const now=new Date();

const year=now.getFullYear();

const month=now.getMonth();

document.getElementById("month")
.textContent=
year+" 年 "+(month+1)+" 月";


const week=["日","一","二","三","四","五","六"];

week.forEach(function(w){

const e=document.createElement("div");

e.textContent=w;

e.style.textAlign="center";

calendar.appendChild(e);

});


const first=
new Date(year,month,1).getDay();

for(let i=0;i<first;i++){

calendar.appendChild(
document.createElement("div")
);

}


const last=
new Date(year,month+1,0).getDate();


for(let day=1;day<=last;day++){

const key=
year+"-"+
String(month+1).padStart(2,"0")+
"-"+
String(day).padStart(2,"0");

const record=data.records[key];

const e=document.createElement("div");

e.className="day";

if(key===today())
e.classList.add("today");

if(record &&
(record.thanks||
record.lucky||
record.mantra)){

e.classList.add("has");

e.innerHTML=
"<b>"+day+"</b><br>"+
"❤️"+(record.thanks||0)+
" 🍀"+(record.lucky||0)+
" 🪷"+(record.mantra||0);

}else{

e.innerHTML="<b>"+day+"</b>";

}

calendar.appendChild(e);

}

}


function render(){

document.getElementById(
"thanks"
).textContent=data.thanks;

document.getElementById(
"lucky"
).textContent=data.lucky;

document.getElementById(
"mantra"
).textContent=
data.mantra[today()]||0;

renderCustom();

renderCalendar();

}


document.getElementById(
"affirmation"
).textContent=
defaultAffirmations[0];

render();

</script>

</body>o
</html>
