<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<link rel="manifest" href="./manifest.webmanifest">

<title>每日感恩・肯定語</title>

<style>
:root{
  --bg:#f7f1e8;
  --card:#fffdf9;
  --ink:#40382f;
  --muted:#8b8176;
  --soft:#f1e7da;
  --line:#e8ded1;
  --gold:#9a7650;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}

main{
  max-width:600px;
  margin:auto;
  padding:18px 16px 50px;
}

.hero{
  text-align:center;
  padding:14px 0 18px;
}

.hero .icon{
  font-size:46px;
}

.hero h1{
  font-size:29px;
  margin:8px 0;
}

.subtitle{
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 5px 20px #00000008;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.count{
  text-align:center;
  background:var(--soft);
  border-radius:18px;
  padding:14px;
}

.num{
  font-size:38px;
  font-weight:700;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  border-radius:14px;
  padding:13px 16px;
  cursor:pointer;
}

.primary{
  width:100%;
  background:var(--ink);
  color:#fff;
  margin-top:10px;
}

.secondary{
  background:var(--soft);
  color:var(--ink);
}

.affirm{
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  line-height:1.6;
  padding:10px;
}

.form{
  display:flex;
  gap:8px;
}

.form input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:white;
}

.chip{
  background:var(--soft);
  margin:5px 3px;
}

.progress{
  height:9px;
  background:var(--soft);
  border-radius:99px;
  overflow:hidden;
  margin-top:14px;
}

.progress > i{
  display:block;
  height:100%;
  width:0;
  background:var(--gold);
  transition:.25s;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
  min-height:52px;
  padding:5px;
  font-size:12px;
}

.has{
  background:#eadcc9;
}

.today{
  outline:2px solid var(--gold);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-box{
  background:#fffaf2;
  border-radius:26px;
  padding:30px;
  text-align:center;
  max-width:400px;
  width:100%;
}

.big{
  font-size:64px;
}

.burst{
  font-size:42px;
  letter-spacing:5px;
  animation:pop .55s ease both;
}

@keyframes pop{
  0%{
    transform:scale(.4);
    opacity:0;
  }
  70%{
    transform:scale(1.15);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:19;
}

.small{
  font-size:13px;
  color:var(--muted);
}

</style>
</head>

<body>

<main>

<section class="hero">

<div class="icon">🌿</div>

<h1>每日感恩・肯定語</h1>

<div class="subtitle">
每天一點點，讓心回到自己身上。
</div>

</section>


<section class="card">

<div class="grid">

<div class="count">
<div class="num" id="thanks">0</div>
謝謝
</div>

<div class="count">
<div class="num" id="lucky">0</div>
我很幸運
</div>

</div>


<button class="primary" onclick="addThanks()">
🙏 謝謝 +1
</button>


<button class="primary" onclick="addLucky()">
🍀 我很幸運 +1
</button>


<div class="progress">
<i id="thanksProgress"></i>
</div>

<p class="small" id="goalText"></p>

</section>



<section class="card">

<h3>✨ 今日肯定語</h3>

<div class="affirm" id="affirmation"></div>

<button class="secondary" onclick="nextAffirmation()">
換一句
</button>

</section>



<section class="card">

<h3>✏️ 自訂肯定句</h3>

<div class="form">

<input
id="customInput"
placeholder="輸入你的肯定句">

<button
class="secondary"
onclick="addCustom()">
加入
</button>

</div>

<div id="customList"></div>

</section>



<section class="card">

<h3>🪷 準提咒</h3>

<div class="grid">

<div class="count">

<div class="num" id="mantra">
0
</div>

今日遍數

</div>

<button
class="secondary"
onclick="addMantra()">

準提咒 +1

</button>

</div>

</section>



<section class="card">

<h3>📅 每日紀錄</h3>

<p id="month"></p>

<div
class="calendar"
id="calendar">
</div>

</section>

</main>



<div
class="modal"
id="milestoneModal">

<div class="modal-box">

<div
class="burst"
id="burst">
🎉 🧨 🎉
</div>

<h2 id="milestoneTitle"></h2>

<p id="milestoneMessage"></p>

<button
class="primary"
onclick="closeModal()">

繼續感恩

</button>

</div>

</div>


<canvas id="confetti"></canvas>



<script>

/* =========================
   資料儲存
========================= */

const STORAGE_KEY = "daily_affirmations";


let data =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
)
||
{
  thanks:0,
  lucky:0,
  mantra:{},
  records:{},
  custom:[]
};



/* =========================
   肯定語
========================= */

const defaultAffirmations = [

"我值得被好好對待。",

"今天的我，已經很棒了。",

"我願意相信事情會越來越好。",

"我有能力創造自己喜歡的生活。",

"我很幸運，也願意看見生活裡的美好。",

"我感謝今天遇見的一切。",

"我值得擁有幸福與豐盛。",

"我正在一步一步成為更好的自己。",

"船到橋頭自然直，我相信事情會有最好的安排。"

];


let affirmationIndex = 0;



/* =========================
   今天日期
   使用台灣手機本地時間
========================= */

function today(){

const d = new Date();

return d.getFullYear()
+"-"
+String(d.getMonth()+1).padStart(2,"0")
+"-"
+String(d.getDate()).padStart(2,"0");

}



/* =========================
   確保今天有紀錄
========================= */

function ensureToday(){

const d = today();

if(!data.records[d]){

data.records[d] = {

thanks:0,

lucky:0,

mantra:0

};

}

}



/* =========================
   儲存
========================= */

function save(){

localStorage.setItem(

STORAGE_KEY,

JSON.stringify(data)

);

render();

}



/* =========================
   謝謝 +1
========================= */

function addThanks(){

data.thanks++;

ensureToday();

data.records[today()].thanks++;

save();


/* 每100次慶祝 */

if(data.thanks % 100 === 0){

celebrate(data.thanks);

}

}



/* =========================
   我很幸運 +1
========================= */

function addLucky(){

data.lucky++;

ensureToday();

data.records[today()].lucky++;

save();

}



/* =========================
   準提咒 +1
========================= */

function addMantra(){

const d = today();

if(!data.mantra[d]){

data.mantra[d] = 0;

}

data.mantra[d]++;

ensureToday();

data.records[d].mantra =
data.mantra[d];

save();

}



/* =========================
   自訂肯定句
========================= */

function addCustom(){

const input =
document.getElementById(
"customInput"
);

const text =
input.value.trim();

if(!text)return;

data.custom.push(text);

input.value="";

save();

}



/* =========================
   換一句
========================= */

function nextAffirmation(){

const all =
defaultAffirmations
.concat(data.custom);

affirmationIndex++;

document.getElementById(
"affirmation"
).textContent =
all[
affirmationIndex % all.length
];

}



/* =========================
   自訂肯定句顯示
========================= */

function renderCustom(){

const box =
document.getElementById(
"customList"
);

box.innerHTML="";

data.custom.forEach(
function(text){

const button =
document.createElement(
"button"
);

button.className =
"chip";

button.textContent =
text;

button.onclick =
function(){

document.getElementById(
"affirmation"
).textContent =
text;

};

box.appendChild(button);

});

}



/* =========================
   月曆
========================= */

function renderCalendar(){

const calendar =
document.getElementById(
"calendar"
);

calendar.innerHTML="";


const now = new Date();

const year =
now.getFullYear();

const month =
now.getMonth();


document.getElementById(
"month"
).textContent =
year
+" 年 "
+(month+1)
+" 月";


const week =
[
"日",
"一",
"二",
"三",
"四",
"五",
"六"
];


week.forEach(
function(w){

const e =
document.createElement(
"div"
);

e.textContent=w;

e.style.textAlign =
"center";

calendar.appendChild(e);

});


const first =
new Date(
year,
month,
1
).getDay();


for(
let i=0;
i<first;
i++
){

calendar.appendChild(
document.createElement(
"div"
)
);

}


const last =
new Date(
year,
month+1,
0
).getDate();


for(
let day=1;
day<=last;
day++
){

const key =
year
+"-"
+String(month+1)
.padStart(2,"0")
+"-"
+String(day)
.padStart(2,"0");


const record =
data.records[key];


const e =
document.createElement(
"div"
);

e.className="day";


if(key===today()){

e.classList.add(
"today"
);

}


if(
record &&
(
(record.thanks||0)
+
(record.lucky||0)
+
(record.mantra||0)
)
){

e.classList.add("has");

e.innerHTML =
"<b>"
+day
+"</b><br>"
+
"❤️"
+(record.thanks||0)
+
" 🍀"
+(record.lucky||0)
+
" 🪷"
+(record.mantra||0);

}
else{

e.innerHTML =
"<b>"
+day
+"</b>";

}


calendar.appendChild(e);

}

}



/* =========================
   畫面更新
========================= */

function render(){

document.getElementById(
"thanks"
).textContent =
data.thanks;


document.getElementById(
"lucky"
).textContent =
data.lucky;


document.getElementById(
"mantra"
).textContent =
data.mantra[today()]||0;


/* 下一個100 */

const next =
(Math.floor(
data.thanks / 100
)+1)*100;


const base =
next - 100;


const percent =
Math.min(
100,
((data.thanks-base)/100)*100
);


document.getElementById(
"thanksProgress"
).style.width =
percent+"%";


document.getElementById(
"goalText"
).textContent =
"距離下一個 100 次里程碑："
+
(next-data.thanks)
+
" 次";


renderCustom();

renderCalendar();

}



/* =========================
   100次 / 1000次慶祝
========================= */

function celebrate(n){

const title =
document.getElementById(
"milestoneTitle"
);

const message =
document.getElementById(
"milestoneMessage"
);

const burst =
document.getElementById(
"burst"
);


title.textContent =
"🎉 "+n+" 次謝謝！";


if(n % 1000 === 0){

burst.textContent =
"🙏 ✨ 🧨 ✨ 🙏";

message.textContent =
"感謝大里程碑！"
+
"願每一次感恩，"
+
"都成為生活裡的光。";

}
else{

burst.textContent =
"🎉 🧨 🎉";

message.textContent =
"謝謝生活，也謝謝自己。"
+
"你正在為自己的每一天留下美好的紀錄。";

}


document.getElementById(
"milestoneModal"
).style.display =
"flex";


confetti();

}



/* =========================
   關閉慶祝視窗
========================= */

function closeModal(){

document.getElementById(
"milestoneModal"
).style.display =
"none";

}



/* =========================
   彩紙動畫
========================= */

function confetti(){

const canvas =
document.getElementById(
"confetti"
);

const ctx =
canvas.getContext("2d");


canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;


let particles =
Array.from(
{
length:120
},
function(){

return {

x:window.innerWidth/2,

y:window.innerHeight*.35,

vx:(Math.random()-.5)*12,

vy:-Math.random()*12-4,

g:.35,

s:Math.random()*7+3,

a:1

};

});


let frame=0;


function animate(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


particles.forEach(
function(p){

p.x += p.vx;

p.vy += p.g;

p.y += p.vy;

p.a -= .012;


ctx.globalAlpha =
Math.max(
0,
p.a
);


ctx.fillStyle =
[
"#9a7650",
"#6f8f5f",
"#d9a441",
"#c96f5b"
]
[
Math.floor(
Math.random()*4
)
];


ctx.fillRect(
p.x,
p.y,
p.s,
p.s
);

});


frame++;


if(frame<100){

requestAnimationFrame(
animate
);

}
else{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

}


animate();

}



/* =========================
   啟動
========================= */

document.getElementById(
"affirmation"
).textContent =
defaultAffirmations[0];


render();

</script>

</body>
</html>
